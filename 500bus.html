<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 跳蛙公車 擁擠度</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{background:#f2f2f7;min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:16px;}
.header{background:#3d9e87;color:white;padding:16px;border-radius:14px;margin-bottom:12px;}
.header h1{font-size:18px;font-weight:600;}
.header p{font-size:12px;opacity:.85;margin-top:2px;}
.select-wrap{background:white;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.select-wrap label{font-size:12px;color:#888;display:block;margin-bottom:6px;}
select{width:100%;font-size:15px;border:1px solid #ddd;border-radius:8px;padding:8px 10px;background:white;color:#1c1c1e;}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;}
.stop-photo{width:100%;height:160px;object-fit:cover;display:block;background:#e5e5ea;}
.no-photo{width:100%;height:80px;background:#e5e5ea;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;}
.stop-info{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f2f2f7;}
.stop-name{font-size:15px;font-weight:600;color:#1c1c1e;}
.stop-meta{font-size:12px;color:#888;margin-top:2px;}
.badge{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;}
.ok{background:#e8f5e0;color:#2e7d32;}
.mid{background:#fff3e0;color:#e65100;}
.busy{background:#fce8e8;color:#b71c1c;}
.bar-wrap{padding:10px 16px 14px;}
.bar-labels{display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-bottom:4px;}
.bar-track{height:8px;border-radius:4px;background:linear-gradient(to right,#4caf50 30%,#ff9800 60%,#f44336 100%);position:relative;}
.bar-marker{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:white;border:2.5px solid #1c1c1e;transform:translateX(-50%);transition:left .4s;}
.section-title{font-size:11px;color:#888;padding:10px 16px 4px;letter-spacing:.04em;text-transform:uppercase;background:#f9f9f9;border-top:1px solid #f2f2f7;}
.stop-row{display:flex;align-items:center;padding:10px 16px;gap:10px;border-top:1px solid #f2f2f7;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:#4caf50;}
.dot-mid{background:#ff9800;}
.dot-busy{background:#f44336;}
.row-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#e5e5ea;}
.row-name{flex:1;font-size:13px;color:#1c1c1e;}
.row-range{font-size:12px;color:#888;min-width:52px;text-align:right;}
.row-label{font-size:11px;padding:2px 8px;border-radius:99px;margin-left:4px;}
.legend{display:flex;gap:12px;padding:0 16px 14px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#888;}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.empty{padding:32px 16px;text-align:center;color:#888;font-size:14px;}
</style>
</head>

<div class="app">
  <div class="header">
    <h1>🚌 500 跳蛙公車</h1>

</div>

const stops = [{"name": "忠義里(中科實驗高中)", "pct": 7}, {"name": "月祥路361巷口", "pct": 12}, {"name": "忠義市場(原文館)", "pct": 20}, {"name": "六寶公園", "pct": 21}, {"name": "月祥文化路口", "pct": 26}, {"name": "六張犁", "pct": 33}, {"name": "亞東公司", "pct": 34}, {"name": "六寶里", "pct": 39}, {"name": "大明國小(中清路)", "pct": 49}, {"name": "大雅", "pct": 55}, {"name": "中清雅潭路口", "pct": 61}, {"name": "南大雅", "pct": 63}, {"name": "大華國中", "pct": 66}, {"name": "大德國中", "pct": 66}, {"name": "水湳市場(中清路)", "pct": 66}, {"name": "水湳", "pct": 66}, {"name": "捷運文心中清站(中清路)", "pct": 63}, {"name": "天津路商圈", "pct": 63}, {"name": "曉明女中(中清路)", "pct": 62}, {"name": "中清漢口路口", "pct": 62}, {"name": "臺中二中", "pct": 42}, {"name": "光大里", "pct": 41}, {"name": "三民錦新街口", "pct": 20}, {"name": "中友百貨", "pct": 18}, {"name": "國立臺中科技大學", "pct": 8}, {"name": "光復國小(三民路)", "pct": 7}, {"name": "臺中州廳", "pct": 0}];

function range(p){const lo=Math.floor(p/10)*10;return lo+"–"+(lo+10)+"%";}
function lv(p){return p<30?"ok":p<60?"mid":"busy";}
function label(p){return p<30?"舒適":p<60?"中等":"壅擠";}

const sel=document.getElementById("sel");
stops.forEach((s,i)=>{
  const o=document.createElement("option");
  o.value=i;
  o.textContent=(i+1).toString().padStart(2,"0")+" "+s.name;
  sel.appendChild(o);
});

sel.addEventListener("change",()=>{
  const mc=document.getElementById("main-card");
  const uc=document.getElementById("upcoming-card");
  const idx=parseInt(sel.value);
  if(isNaN(idx)){mc.innerHTML='<div class="empty">請選擇上車站點以查看擁擠狀況</div>';uc.innerHTML="";return;}
  const s=stops[idx];
  const cl=lv(s.pct);
  const photo=photos[s.name];
  const marker=Math.min(s.pct,98);

  let mhtml="";
  if(photo){mhtml+=`<img class="stop-photo" src="${photo}" alt="${s.name}">`;}
  else{mhtml+=`<div class="no-photo">暫無照片</div>`;}
  mhtml+=`<div class="stop-info"><div><div class="stop-name">${s.name}</div><div class="stop-meta">第 ${idx+1} 站 · 擁擠度 ${range(s.pct)}</div></div><span class="badge ${cl}">${label(s.pct)}</span></div>`;
  mhtml+=`<div class="bar-wrap"><div class="bar-labels"><span>0%</span><span>30%</span><span>60%</span><span>100%</span></div><div class="bar-track"><div class="bar-marker" style="left:${marker}%"></div></div></div>`;
  mhtml+=`<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>舒適 &lt;30%</div><div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>中等 30–60%</div><div class="legend-item"><div class="legend-dot" style="background:#f44336"></div>壅擠 &gt;60%</div></div>`;
  mc.innerHTML=mhtml;

  const upcoming=stops.slice(idx+1);
  if(upcoming.length===0){uc.innerHTML="";return;}
  let uhtml=`<div class="card"><div class="section-title">後續站點擁擠預測</div>`;
  upcoming.forEach((u,j)=>{
    const ul=lv(u.pct);
    const thumb=photos[u.name];
    uhtml+=`<div class="stop-row"><div class="dot dot-${ul}"></div>`;
    if(thumb){uhtml+=`<img class="row-thumb" src="${thumb}" alt="${u.name}">`;}
    else{uhtml+=`<div class="row-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;">無圖</div>`;}
    uhtml+=`<div class="row-name">${idx+2+j}. ${u.name}</div><div class="row-range">${range(u.pct)}</div><span class="row-label ${ul}">${label(u.pct)}</span></div>`;
  });
  uhtml+="</div>";
  uc.innerHTML=uhtml;
});
</script>
