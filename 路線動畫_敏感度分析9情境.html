<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>YouBike 調度路線 — 敏感度分析</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#0d0d1a}
#map{width:100%;height:100vh}

/* ── Panel ── */
#panel{
  position:fixed;top:14px;left:14px;z-index:1000;
  background:rgba(10,10,26,0.94);border:1px solid #252545;
  border-radius:14px;width:296px;backdrop-filter:blur(10px);overflow:hidden;
}
#ph{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 15px;cursor:pointer;user-select:none;
  border-bottom:1px solid #1c1c38;
}
#ph h2{font-size:13px;color:#7ecfff;letter-spacing:.4px;font-weight:600}
#tb{background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:0}
#pb{padding:12px 14px 14px}

/* ── 3×3 Grid ── */
.grid-wrap{margin-bottom:12px}
.grid-header{
  display:grid;grid-template-columns:52px repeat(3,1fr);
  gap:4px;margin-bottom:4px;
}
.gh{font-size:10px;color:#555;text-align:center;padding:3px 0}
.grid-row{display:grid;grid-template-columns:52px repeat(3,1fr);gap:4px;margin-bottom:4px}
.row-label{
  font-size:10px;color:#555;text-align:right;
  padding-right:6px;display:flex;align-items:center;justify-content:flex-end;line-height:1.3
}
.gc{
  padding:7px 4px;border:1px solid #222240;border-radius:8px;
  background:#111128;color:#999;font-size:11px;cursor:pointer;
  text-align:center;line-height:1.3;transition:.15s;
}
.gc:hover{background:#1a1a38;border-color:#3a5a8a;color:#ccc}
.gc.active{background:#1d4a8a;border-color:#3A86FF;color:#fff}
.gc .fleet-num{font-weight:600;font-size:12px;color:#ccc}
.gc.active .fleet-num{color:#fff}
.gc .svc-pct{font-size:10px;margin-top:2px}
.s-green{color:#4ecdc4}.s-orange{color:#ffb347}.s-red{color:#ff7070}

/* ── Divider ── */
.div{border:none;border-top:1px solid #1c1c38;margin:10px 0}

/* ── Vehicle list ── */
#vlist .vr{display:flex;align-items:center;gap:7px;margin:4px 0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.vi{color:#bbb;font-size:11px;flex:1}
.eye{cursor:pointer;font-size:12px;opacity:.6;flex-shrink:0}
.eye:hover{opacity:1}

/* ── Stats box ── */
#stats{
  font-size:11px;color:#777;
  padding:8px 10px;background:#0a0a1c;border-radius:8px;
  line-height:1.9;margin:8px 0
}
#stats b{color:#7ecfff}

/* ── Buttons ── */
#ctrl{display:flex;gap:6px;margin:8px 0}
.cb{flex:1;padding:7px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
#bp{background:#3A86FF;color:#fff}
#bp:hover{background:#2060cc}
#br{background:#1e1e34;color:#999}
#br:hover{background:#252545}

/* ── Speed ── */
.spd-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#666;margin:4px 0}
.spd-row b{color:#7ecfff;min-width:22px}
input[type=range]{flex:1;accent-color:#3A86FF;height:3px}

/* ── Bottom row ── */
.bot{display:flex;align-items:center;gap:8px;margin-top:8px}
#bgt{padding:5px 12px;border:1px solid #252545;border-radius:7px;
     background:#111128;color:#aaa;font-size:11px;cursor:pointer;transition:.15s}
#bgt:hover{background:#1a1a38}
.leg{display:flex;gap:10px;flex:1;justify-content:flex-end}
.lr{display:flex;align-items:center;gap:4px;font-size:10px;color:#666}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Toast ── */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:rgba(10,10,26,.96);border:1px solid #2a4a6a;border-radius:9px;
  padding:8px 18px;font-size:12px;z-index:1000;display:none;
  max-width:420px;text-align:center;color:#ccc;backdrop-filter:blur(6px)
}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="ph">
    <h2>&#x1F6B2; YouBike 調度敏感度分析</h2>
    <button id="tb">&#x25B2;</button>
  </div>
  <div id="pb">

    <!-- Grid -->
    <div class="grid-wrap">
      <div class="grid-header">
        <div class="gh" style="text-align:left;color:#444;font-size:9px">容量↓/車隊→</div>
        <div class="gh">3 輛</div>
        <div class="gh">4 輛</div>
        <div class="gh">5 輛</div>
      </div>
      <div id="grid-body"></div>
    </div>

    <hr class="div">

    <!-- Vehicle list -->
    <div id="vlist"></div>

    <!-- Stats -->
    <div id="stats"></div>

    <!-- Controls -->
    <div id="ctrl">
      <button class="cb" id="bp">&#x25B6; 播放</button>
      <button class="cb" id="br">&#x27F3; 重置</button>
    </div>
    <div class="spd-row">速度 <b id="sv">3x</b><input type="range" id="spd" min="1" max="10" value="3"></div>

    <!-- Bottom -->
    <div class="bot">
      <button id="bgt">&#x2600; 白底</button>
      <div class="leg">
        <div class="lr"><div class="ld" style="background:#ff6b35"></div>大站</div>
        <div class="lr"><div class="ld" style="background:#4ecdc4"></div>小站</div>
        <div class="lr"><div class="ld" style="background:#ff4444;border-radius:2px"></div>未服務</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

"小站", "cap": 25, "stock": 14, "lat": 24.17021, "lon": 120.65429, "demand": 4, "load_after": 15, "action": "取 4 台"}, {"name": "青海公園(四川東街)", "type": "小站", "cap": 33, "stock": 18, "lat": 24.16441, "lon": 120.65334, "demand": 5, "load_after": 18, "action": "取 5 台"}, {"name": "臺灣大道文心路口(西北側)", "type": "小站", "cap": 30, "stock": 16, "lat": 24.163, "lon": 120.64945, "demand": 4, "load_after": 0, "action": "取 4 台"}, {"name": "臺中市政府(惠中路)", "type": "小站", "cap": 42, "stock": 23, "lat": 24.16303, "lon": 120.64574, "demand": 6, "load_after": 28, "action": "取 6 台"}, {"name": "新光/遠百", "type": "大站", "cap": 84, "stock": 46, "lat": 24.16614, "lon": 120.64292, "demand": 4, "load_after": 32, "action": "取 4 台"}, {"name": "市政公園停車場", "type": "小站", "cap": 38, "stock": 21, "lat": 24.16099, "lon": 120.64453, "demand": 6, "load_after": 0, "action": "取 6 台"}, {"name": "頂何厝", "type": "小站", "cap": 28, "stock": 15, "lat": 24.15924, "lon": 120.65532, "demand": 4, "load_after": 7, "action": "取 4 台"}, {"name": "大安公園", "type": "小站", "cap": 21, "stock": 12, "lat": 24.15803, "lon": 120.65431, "demand": 4, "load_after": 11, "action": "取 4 台"}], "active": true}]}};
const CAPS   = [30,40,50];
const FLEETS = [3,4,5];
const COLORS = ["#E84855","#3A86FF","#2DC653","#FF9F1C","#C77DFF"];
const DARK   = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";
const LIGHT  = "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";

let curKey = "車隊3_容量30";
let visV = {}, bgDark=true, speed=0.024, animFrame=null, animating=false, animVehicles=[];

// Build grid
const gridBody = document.getElementById("grid-body");
CAPS.forEach(cap => {
  const row = document.createElement("div");
  row.className = "grid-row";
  // Row label
  const lbl = document.createElement("div");
  lbl.className = "row-label";
  lbl.innerHTML = `${cap}<br>台`;
  row.appendChild(lbl);
  // Cells
  FLEETS.forEach(fleet => {
    const key = `車隊${fleet}_容量${cap}`;
    const sc  = ALL[key];
    const cell = document.createElement("div");
    cell.className = "gc" + (key===curKey?" active":"");
    cell.dataset.key = key;
    if (sc) {
      const sc2 = sc.svc_rate>=80?"s-green":sc.svc_rate>=60?"s-orange":"s-red";
      cell.innerHTML = `<div class="fleet-num">${fleet}輛</div><div class="svc-pct ${sc2}">${sc.svc_rate}%</div>`;
      cell.addEventListener("click", () => selectScenario(key));
    } else {
      cell.innerHTML = `<div class="fleet-num" style="color:#333">${fleet}輛</div><div class="svc-pct" style="color:#333">—</div>`;
    }
    row.appendChild(cell);
  });
  gridBody.appendChild(row);
});

// Map
const map = L.map("map",{zoomControl:true}).setView([24.173,120.642],14);
let tile = L.tileLayer(DARK,{attribution:"CartoDB",maxZoom:19}).addTo(map);

// Layer cache
const cache = {};
const allCoords = {};
Object.values(ALL).forEach(sc => sc.vehicles.forEach(v => v.stops.forEach(s => {
  if(s.lat&&s.lon) allCoords[s.name]={lat:s.lat,lon:s.lon};
})));

function buildLayers(key) {
  if (cache[key]) return cache[key];
  const sc=ALL[key], lines=[], staMrks=[], skipMrks=[];
  sc.vehicles.forEach((v,i)=>{
    const ll=v.stops.filter(s=>s.lat&&s.lon).map(s=>[s.lat,s.lon]);
    if(ll.length>1) lines.push(L.polyline(ll,{color:COLORS[i],weight:3,opacity:.5,dashArray:"7,4"}));
  });
  const seen={};
  sc.vehicles.forEach(v=>v.stops.forEach(s=>{
    if(seen[s.name]||!s.lat) return; seen[s.name]=true;
    const col=s.type==="大站"?"#ff6b35":"#4ecdc4";
    staMrks.push(L.circleMarker([s.lat,s.lon],{radius:s.type==="大站"?9:6,color:"#fff",weight:1.2,fillColor:col,fillOpacity:.9})
      .bindPopup(`<b>${s.name}</b><br>${s.type} | 車位:${s.cap} 現有:${s.stock}台`));
  }));
  sc.skipped.forEach(name=>{
    const c=allCoords[name]; if(!c) return;
    skipMrks.push(L.circleMarker([c.lat,c.lon],{radius:9,color:"#ff4444",weight:2,fillColor:"#1a0000",fillOpacity:.8})
      .bindPopup(`<b>${name}</b><br>❌ 未服務大站`));
  });
  return cache[key]={lines,staMrks,skipMrks};
}

function clearAll(){Object.values(cache).forEach(lg=>{lg.lines.forEach(l=>l.remove());lg.staMrks.forEach(m=>m.remove());lg.skipMrks.forEach(m=>m.remove());})}

function showLayers(key){
  clearAll();
  const lg=buildLayers(key),sc=ALL[key];
  lg.lines.forEach((l,i)=>{if(visV[key]&&visV[key][i])l.addTo(map);});
  lg.staMrks.forEach(m=>m.addTo(map));
  lg.skipMrks.forEach(m=>m.addTo(map));
}

function initVisV(key){
  if(!visV[key]){visV[key]={};ALL[key].vehicles.forEach((_,i)=>visV[key][i]=true);}
}

function updateVlist(key){
  const sc=ALL[key],div=document.getElementById("vlist");
  div.innerHTML="";
  sc.vehicles.forEach((v,i)=>{
    const row=document.createElement("div"); row.className="vr";
    row.innerHTML=`<div class="dot" style="background:${COLORS[i]}"></div>
      <div class="vi">車隊${v.v} · ${v.stops.length}站 · ${(v.dist/1000).toFixed(1)}km · 取${v.pick}/送${v.delv}台</div>
      <div class="eye" data-vi="${i}">${visV[key][i]?"👁":"🚫"}</div>`;
    row.querySelector(".eye").addEventListener("click",function(){
      const vi=parseInt(this.dataset.vi); visV[key][vi]=!visV[key][vi];
      this.textContent=visV[key][vi]?"👁":"🚫";
      const lg=buildLayers(key);
      if(visV[key][vi])lg.lines[vi].addTo(map); else lg.lines[vi].remove();
    });
    div.appendChild(row);
  });
}

function updateStats(key){
  const sc=ALL[key];
  const col=sc.svc_rate>=80?"#4ecdc4":sc.svc_rate>=60?"#ffb347":"#ff7070";
  document.getElementById("stats").innerHTML=
    `供給 <b>${sc.supply}</b>台 ｜ 需求 <b>${sc.need}</b>台 ｜ 理論上限 <b>${sc.theory}%</b><br>`+
    `總距離 <b>${(sc.total_dist/1000).toFixed(1)}</b> km ｜ 服務率 <b style="color:${col}">${sc.svc_rate}%</b>`+
    (sc.skipped&&sc.skipped.length?`<br><span style="color:#ff7070">未服務：${sc.skipped.join("、")}</span>`:"");
}

function initAnim(key){
  animVehicles.forEach(av=>{av.marker&&av.marker.remove();av.trail&&av.trail.remove();});
  animVehicles=[];
  ALL[key].vehicles.forEach((v,i)=>{
    const first=v.stops.find(s=>s.lat&&s.lon); if(!first) return;
    const icon=L.divIcon({html:`<div style="width:20px;height:20px;border-radius:50%;background:${COLORS[i]};border:2px solid #fff;box-shadow:0 0 8px ${COLORS[i]};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#fff">${v.v}</div>`,iconSize:[20,20],iconAnchor:[10,10],className:""});
    animVehicles.push({v,i,marker:L.marker([first.lat,first.lon],{icon,zIndexOffset:1000}).addTo(map),trail:L.polyline([],{color:COLORS[i],weight:4,opacity:.9}).addTo(map),stopIdx:0,t:0,done:false});
  });
}

const toast=document.getElementById("toast");
function showToast(h){toast.innerHTML=h;toast.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display="none",2400);}
function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

function animate(){
  let done=true;
  animVehicles.forEach(av=>{
    if(av.done||!visV[curKey][av.i]) return;
    done=false;
    const stops=av.v.stops.filter(s=>s.lat&&s.lon);
    if(av.stopIdx>=stops.length-1){av.done=true;return;}
    const from=[stops[av.stopIdx].lat,stops[av.stopIdx].lon];
    const to=[stops[av.stopIdx+1].lat,stops[av.stopIdx+1].lon];
    av.t+=speed;
    if(av.t>=1){
      av.t=0;av.stopIdx++;
      const s=stops[av.stopIdx];
      av.trail.addLatLng([s.lat,s.lon]);
      const tc=s.type==="大站"?"#ff6b35":"#4ecdc4";
      showToast(`<b style="color:${tc}">[${s.type}]</b> <b>${s.name}</b> · 車隊${av.v.v} · ${s.action} · 剩${s.load_after}台`);
    } else { av.marker.setLatLng(lerp(from,to,av.t)); }
  });
  if(!done) animFrame=requestAnimationFrame(animate);
  else{document.getElementById("bp").textContent="✓ 完成";animating=false;}
}

function stopAnim(){if(animFrame)cancelAnimationFrame(animFrame);animating=false;document.getElementById("bp").textContent="▶ 播放";}

function selectScenario(key){
  stopAnim(); curKey=key;
  initVisV(key); showLayers(key); updateVlist(key); updateStats(key); initAnim(key);
  document.querySelectorAll(".gc").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
}

// Init
initVisV(curKey); buildLayers(curKey); selectScenario(curKey);

document.getElementById("bp").addEventListener("click",()=>{if(animating)return;animating=true;document.getElementById("bp").textContent="⏸ 播放中...";animFrame=requestAnimationFrame(animate);});
document.getElementById("br").addEventListener("click",()=>{stopAnim();selectScenario(curKey);});
document.getElementById("spd").addEventListener("input",e=>{const v=parseInt(e.target.value);speed=0.008*v;document.getElementById("sv").textContent=v+"x";});

let open=true;
document.getElementById("ph").addEventListener("click",()=>{open=!open;document.getElementById("pb").style.display=open?"block":"none";document.getElementById("tb").textContent=open?"▲":"▼";});

let dark=true;
document.getElementById("bgt").addEventListener("click",function(){dark=!dark;tile.remove();tile=L.tileLayer(dark?DARK:LIGHT,{attribution:"CartoDB",maxZoom:19}).addTo(map);this.textContent=dark?"☀ 白底":"🌙 黑底";});
</script>
