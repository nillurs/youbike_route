<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>YouBike 調度路線動畫</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#0d0d1a}
#map{width:100%;height:100vh}

/* Panel */
#panel{
  position:fixed;top:14px;left:14px;z-index:1000;
  background:rgba(13,13,26,0.93);border:1px solid #2a2a4a;
  border-radius:14px;width:280px;backdrop-filter:blur(8px);
  transition:height 0.3s;overflow:hidden;
}
#panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;
}
#panel-header h2{font-size:14px;color:#7ecfff;letter-spacing:0.5px}
#toggle-btn{background:none;border:none;color:#7ecfff;font-size:16px;cursor:pointer;padding:0 4px}
#panel-body{padding:0 16px 14px}

/* Scenario selector */
.sc-tabs{display:flex;gap:6px;margin-bottom:12px}
.sc-tab{
  flex:1;padding:5px 4px;border:1px solid #334;border-radius:7px;
  background:#1a1a30;color:#aaa;font-size:12px;cursor:pointer;text-align:center;transition:0.2s
}
.sc-tab.active{background:#2E75B6;border-color:#2E75B6;color:#fff;font-weight:bold}

/* Vehicle list */
.v-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.v-info{color:#ccc}
.v-toggle{margin-left:auto;cursor:pointer;font-size:14px;opacity:0.7}
.v-toggle:hover{opacity:1}

/* Stats */
#stats{font-size:12px;color:#aaa;margin:8px 0;padding:8px;background:#0a0a1a;border-radius:8px;line-height:1.8}
#stats span{color:#7ecfff;font-weight:bold}

/* Controls */
#controls{display:flex;gap:6px;margin:10px 0}
button.ctrl{
  flex:1;padding:6px;border:none;border-radius:8px;cursor:pointer;
  font-size:12px;font-weight:bold;transition:0.2s
}
#btnPlay{background:#3A86FF;color:#fff}
#btnPlay:hover{background:#2060cc}
#btnReset{background:#333;color:#ccc}
#btnReset:hover{background:#444}

/* Sliders */
.slider-row{margin:6px 0;font-size:11px;color:#888}
.slider-row label{display:flex;justify-content:space-between;margin-bottom:3px}
.slider-row label span{color:#7ecfff}
input[type=range]{width:100%;accent-color:#3A86FF;height:4px}

/* Map controls */
#map-ctrls{margin-top:10px;border-top:1px solid #2a2a4a;padding-top:10px}
.map-ctrl-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:#aaa}
#bg-toggle{
  padding:4px 10px;border:1px solid #334;border-radius:6px;
  background:#1a1a30;color:#ccc;font-size:11px;cursor:pointer;transition:0.2s
}
#bg-toggle:hover{background:#2a2a40}

/* Legend */
.legend{margin-top:10px;border-top:1px solid #2a2a4a;padding-top:8px}
.leg-row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11px;color:#888}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* Info toast */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(13,13,30,0.96);border:1px solid #2a4a6a;
  border-radius:10px;padding:9px 18px;font-size:13px;z-index:1000;
  display:none;max-width:400px;text-align:center;backdrop-filter:blur(6px);color:#ddd
}
#toast b{color:#7ecfff}
</style>
</head>

            font-size:10px;font-weight:bold;color:#fff">${v.v}</div>`,
      iconSize:[22,22],iconAnchor:[11,11],className:""
    });
    const marker = L.marker([v.stops[0].lat,v.stops[0].lon],{icon,zIndexOffset:1000}).addTo(map);
    const trail  = L.polyline([],{color:COLORS[vi],weight:4.5,opacity:0.9}).addTo(map);
    animVehicles.push({v,vi,marker,trail,stopIdx:0,t:0,done:false});
  });
}

function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

const toast = document.getElementById("toast");
function showToast(html){
  toast.innerHTML=html; toast.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(()=>toast.style.display="none",2800);
}

function animate(){
  let allDone=true;
  animVehicles.forEach(av=>{
    if(av.done||!visibleV[currentSc][av.vi]) return;
    allDone=false;
    const stops=av.v.stops;
    if(av.stopIdx>=stops.length-1){av.done=true;return;}
    const from=[stops[av.stopIdx].lat,stops[av.stopIdx].lon];
    const to  =[stops[av.stopIdx+1].lat,stops[av.stopIdx+1].lon];
    av.t+=speed;
    if(av.t>=1){
      av.t=0; av.stopIdx++;
      const s=stops[av.stopIdx];
      av.trail.addLatLng([s.lat,s.lon]);
      const typeColor=s.type==="大站"?"#ff6b35":"#4ecdc4";
      showToast(`<b style="color:${typeColor}">[${s.type}]</b> <b>${s.name}</b><br>車隊${av.v.v} · ${s.action} · 離開剩 ${s.load_after} 台`);
    } else {
      av.marker.setLatLng(lerp(from,to,av.t));
    }
  });
  if(!allDone) animFrame=requestAnimationFrame(animate);
  else { document.getElementById("btnPlay").textContent="✓ 完成"; animating=false; }
}

function showScenario(key){
  // Hide all
  SC_KEYS.forEach(k=>{
    const lg=layerGroups[k];
    lg.lines.forEach(l=>l.remove());
    lg.stationMarkers.forEach(m=>m.remove());
    lg.skippedMarkers.forEach(m=>m.remove());
  });
  // Show current
  const lg=layerGroups[key];
  const sc=ALL[key];
  lg.lines.forEach((l,i)=>{ if(visibleV[key][i]) l.addTo(map); });
  lg.stationMarkers.forEach(m=>m.addTo(map));
  lg.skippedMarkers.forEach(m=>m.addTo(map));

  // Update vehicle list
  const vList=document.getElementById("v-list");
  vList.innerHTML="";
  sc.vehicles.forEach((v,i)=>{
    const row=document.createElement("div");
    row.className="v-row";
    const eye=visibleV[key][i]?"👁":"🚫";
    row.innerHTML=`<div class="dot" style="background:${COLORS[i]}"></div>
      <div class="v-info">車隊${v.v} ${v.stops.length}站 ${(v.dist/1000).toFixed(1)}km
      取${v.pick}台 送${v.delv}台</div>
      <div class="v-toggle" data-vi="${i}">${eye}</div>`;
    row.querySelector(".v-toggle").addEventListener("click",function(){
      const vi=parseInt(this.dataset.vi);
      visibleV[key][vi]=!visibleV[key][vi];
      this.textContent=visibleV[key][vi]?"👁":"🚫";
      if(visibleV[key][vi]) lg.lines[vi].addTo(map);
      else lg.lines[vi].remove();
    });
    vList.appendChild(row);
  });

  // Stats
  const svc_color=sc.svc>=100?"#2DC653":"#ff6b35";
  document.getElementById("stats").innerHTML=
    `供給 <span>${sc.supply}</span>台 | 需求 <span>${sc.need}</span>台<br>
     理論上限 <span>${sc.theory}%</span> | 服務率 <span style="color:${svc_color}">${sc.svc}%</span><br>
     總距離 <span>${(sc.dist/1000).toFixed(2)}</span>公里
     ${sc.skipped&&sc.skipped.length?`<br><span style="color:#ff4444">未服務：${sc.skipped.join("、")}</span>`:""}`;

  initAnimVehicles(key);
  stopAnim();
}

function stopAnim(){
  if(animFrame) cancelAnimationFrame(animFrame);
  animating=false;
  document.getElementById("btnPlay").textContent="▶ 播放";
}

// Scenario tabs
const tabsDiv=document.getElementById("sc-tabs");
SC_KEYS.forEach(key=>{
  const sc=ALL[key];
  const btn=document.createElement("button");
  btn.className="sc-tab"+(key===currentSc?" active":"");
  btn.textContent=key;
  btn.title=sc.label;
  btn.addEventListener("click",()=>{
    currentSc=key;
    document.querySelectorAll(".sc-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    showScenario(key);
  });
  tabsDiv.appendChild(btn);
});

// Play / Reset
document.getElementById("btnPlay").addEventListener("click",()=>{
  if(animating) return;
  animating=true;
  document.getElementById("btnPlay").textContent="⏸ 播放中...";
  animFrame=requestAnimationFrame(animate);
});
document.getElementById("btnReset").addEventListener("click",()=>{
  stopAnim();
  showScenario(currentSc);
});
document.getElementById("speedRange").addEventListener("input",e=>{
  const v=parseInt(e.target.value);
  speed=0.008*v;
  document.getElementById("spd-val").textContent=v+"x";
});

// Panel collapse
let panelOpen=true;
const panelBody=document.getElementById("panel-body");
const toggleBtn=document.getElementById("toggle-btn");
document.getElementById("panel-header").addEventListener("click",()=>{
  panelOpen=!panelOpen;
  panelBody.style.display=panelOpen?"block":"none";
  toggleBtn.textContent=panelOpen?"▲":"▼";
});

// Background toggle
let bgDark=true;
document.getElementById("bg-toggle").addEventListener("click",function(){
  bgDark=!bgDark;
  tileLayer.remove();
  tileLayer=L.tileLayer(bgDark?DARK_TILE:LIGHT_TILE,{attribution:"CartoDB",maxZoom:19}).addTo(map);
  document.getElementById("map").style.background=bgDark?"#0d0d1a":"#f0f0f0";
  this.textContent=bgDark?"☀ 切換白底":"🌙 切換黑底";
});

// Init
showScenario(currentSc);
</script>
